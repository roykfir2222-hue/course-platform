<!DOCTYPE html>
<html dir="rtl" lang="he" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>קוד האימות שלך — Masterclass</title>
  <!--[if mso]>
  <noscript>
    <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#09090b;font-family:'Helvetica Neue',Arial,sans-serif;direction:rtl;text-align:right;-webkit-font-smoothing:antialiased;">

  <!-- Outer wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#09090b;padding:48px 16px;">
    <tr>
      <td align="center">

        <!-- Card container -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background-color:#18181b;border:1px solid rgba(255,255,255,0.07);border-radius:16px;overflow:hidden;">

          <!-- ── Header ── -->
          <tr>
            <td style="padding:28px 36px;border-bottom:1px solid rgba(255,255,255,0.06);">
              <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td>
                    <!-- Logo pill -->
                    <table cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="background-color:#7c3aed;border-radius:10px;width:32px;height:32px;text-align:center;vertical-align:middle;">
                          <span style="color:#ffffff;font-size:15px;line-height:32px;display:block;">⌨</span>
                        </td>
                        <td style="padding-right:10px;vertical-align:middle;">
                          <span style="font-size:15px;font-weight:700;color:#e4e4e7;letter-spacing:-0.3px;">Masterclass</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ── Body ── -->
          <tr>
            <td style="padding:40px 36px 32px;">

              <!-- Title -->
              <h1 style="margin:0 0 10px;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:-0.5px;line-height:1.3;">
                קוד האימות שלך
              </h1>

              <!-- Subtitle -->
              <p style="margin:0 0 32px;font-size:14px;color:#a1a1aa;line-height:1.7;">
                הזן את הקוד הבא כדי לאמת את כתובת האימייל שלך ולהמשיך להרשמה לקורס.
              </p>

              <!-- OTP code box -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:32px;">
                <tr>
                  <td style="background-color:#09090b;border:1px solid #3f3f46;border-radius:12px;padding:28px 24px;text-align:center;">
                    <p style="margin:0 0 10px;font-size:11px;font-weight:600;color:#71717a;text-transform:uppercase;letter-spacing:3px;">הקוד שלך</p>
                    <p style="margin:0;font-size:42px;font-weight:800;color:#ffffff;letter-spacing:14px;font-variant-numeric:tabular-nums;direction:ltr;">{{ .Token }}</p>
                  </td>
                </tr>
              </table>

              <!-- Info bullets -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding-bottom:10px;">
                    <table cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="width:6px;height:6px;background-color:#7c3aed;border-radius:50%;vertical-align:top;padding-top:5px;" width="6">&nbsp;</td>
                        <td style="padding-right:10px;font-size:13px;color:#71717a;line-height:1.6;">
                          הקוד בתוקף למשך <span style="color:#a1a1aa;font-weight:600;">10 דקות</span>.
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td>
                    <table cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="width:6px;height:6px;background-color:#7c3aed;border-radius:50%;vertical-align:top;padding-top:5px;" width="6">&nbsp;</td>
                        <td style="padding-right:10px;font-size:13px;color:#71717a;line-height:1.6;">
                          אם לא ביקשת קוד זה, ניתן להתעלם מאימייל זה בבטחה.
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- ── Divider ── -->
          <tr>
            <td style="padding:0 36px;">
              <div style="height:1px;background-color:rgba(255,255,255,0.06);"></div>
            </td>
          </tr>

          <!-- ── Footer ── -->
          <tr>
            <td style="padding:20px 36px;">
              <p style="margin:0;font-size:12px;color:#52525b;text-align:center;line-height:1.6;">
                © 2025 Masterclass · כל הזכויות שמורות<br/>
                קיבלת אימייל זה כי נרשמת לקורס ב-Masterclass.
              </p>
            </td>
          </tr>

        </table>
        <!-- /Card container -->

      </td>
    </tr>
  </table>
  <!-- /Outer wrapper -->

</body>
</html>
